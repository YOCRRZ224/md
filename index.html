           RESET
        ───────────────────────────── */

        * {

            padding: 0;

            --paper: #f7f3e8;

            --accent-soft: rgba(196, 90, 61, 0.08);

            --radius: 14px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(255, 255, 255, 0.9),
                    transparent 42%
                ),

            font-family:
                -apple-system,
                BlinkMacSystemFont,

        }

        a {

        }

        button,

        }

        ::selection {
            background: rgba(196, 90, 61, 0.18);

        /* ─────────────────────────────
           LAYOUT
        ───────────────────────────── */

           NAVIGATION
        ───────────────────────────── */

        }

        }

            text-decoration: none;

                color 0.2s ease;

        }

           HERO

           POSTS HEADER
        ───────────────────────────── */

        /* ─────────────────────────────
           POSTS
        ───────────────────────────── */

        .posts {
            display: grid;

        .post {
            position: relative;

            display: grid;
            grid-template-columns: 150px minmax(0, 1fr) 34px;
            align-items: center;

            gap: 24px;

            min-height: 100px;

            padding: 24px 2px;

            border-bottom: 1px solid var(--border);

            color: inherit;
            text-decoration: none;

            transition:
                padding 0.25s ease,
                background 0.25s ease;
        }

        .post::before {
            content: "";

            position: absolute;

            left: -20px;
            right: -20px;
            top: 0;
            bottom: 0;

            border-radius: 10px;

            background: transparent;

            z-index: -1;

            transition:
                background 0.25s ease;

            padding-left: 10px;
            padding-right: 10px;

        .post:hover::before {
            background: var(--accent-soft);
        }

            transition:

        }

        .post:hover .title {

        }

        .post-arrow {
            display: grid;
            place-items: center;

            width: 30px;
            height: 30px;

            border: 1px solid var(--border-dark);
            border-radius: 50%;

            color: var(--muted);

            transition:

                border-color 0.2s ease,
                transform 0.2s ease;

        .post:hover .post-arrow {
            color: var(--accent);
            border-color: var(--accent);

            transform: translateX(3px);
        }

        /* ─────────────────────────────
           LOADING
        ───────────────────────────── */

        .loading {
            display: grid;
            gap: 0;
        }

        .loading-line {
            height: 100px;

            border-bottom: 1px solid var(--border);

            position: relative;
            overflow: hidden;
        }

        .loading-line::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.5),
                    transparent
                );

            transform: translateX(-100%);

            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            to {

            }
        }

        /* ─────────────────────────────
           EMPTY / ERROR

           RESPONSIVE

            }

            .feed-button {
                margin-top: 22px;

            .post {
                grid-template-columns: 1fr 30px;

                gap: 12px;

                padding: 22px 2px;
            }

            .date {
                grid-column: 1 / -1;

                margin-bottom: -2px;
            }

            .title {
                font-size: 17px;
            }

            .post::before {
                left: -10px;
                right: -10px;
            }

            .post:hover {
                padding-left: 6px;
                padding-right: 6px;
            }

            .footer-inner {
                flex-direction: column;
                gap: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;

    <script>
        const status = document.getElementById("status");
        const posts = document.getElementById("posts");
        let allEntries = [];
        let searchTimer;

        function formatDate(timestamp) {
            const date = new Date(timestamp);

            if (Number.isNaN(date.getTime())) {
                return timestamp;
            }

            return date.toLocaleString(undefined, {
                dateStyle: "medium",
                timeStyle: "short"
            });
        }


        function createArrowIcon() {
            const svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );

            svg.setAttribute("class", "icon");
            svg.setAttribute("viewBox", "0 0 24 24");
            svg.setAttribute("aria-hidden", "true");

            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

            line.setAttribute("d", "M5 12h13");

            const arrow =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

            arrow.setAttribute("d", "m13 6 6 6-6 6");

            svg.append(line, arrow);

            return svg;
        }


function fuzzyScore(text, query) {
    text = text.toLowerCase();
    query = query.toLowerCase();

    if (!query) return 0;

    if (text === query) return 1000;

    if (text.startsWith(query)) return 800;

    if (text.includes(query)) return 600;

    let score = 0;
    let queryIndex = 0;
    let previousIndex = -1;

    for (const char of query) {
        const index = text.indexOf(char, queryIndex);

        if (index === -1) {
            return 0;
        }

        if (previousIndex !== -1) {
            score += Math.max(
                1,
                10 - (index - previousIndex)
            );
        }

        previousIndex = index;
        queryIndex = index + 1;
    }

    return 100 + score;
}

function highlightMatch(text, query) {
    if (!query) {
        return document.createTextNode(text);
    }

    const fragment = document.createDocumentFragment();

    const escaped = query.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

    const regex = new RegExp(
        `(${escaped})`,
        "ig"
    );

    let lastIndex = 0;

    for (const match of text.matchAll(regex)) {
        fragment.append(
            document.createTextNode(
                text.slice(lastIndex, match.index)
            )
        );

        const mark = document.createElement("mark");
        mark.className = "search-highlight";
        mark.textContent = match[0];

        fragment.appendChild(mark);

        lastIndex =
            match.index + match[0].length;
    }

    fragment.append(
        document.createTextNode(
            text.slice(lastIndex)
        )
    );

    return fragment;
}

function renderPosts(entries, query = "") {
    posts.replaceChildren();

    const normalizedQuery =
        query.trim().toLowerCase();

    let filtered = entries;

    if (normalizedQuery) {
        filtered = entries
            .map(entry => ({
                entry,
                score: Math.max(
                    fuzzyScore(entry.title, normalizedQuery),
                    fuzzyScore(entry.url, normalizedQuery) * 0.5
                )
            }))
            .filter(item => item.score > 0)
            .sort((a, b) => b.score - a.score)
            .map(item => item.entry);
    }

    if (!filtered.length) {
        status.textContent = "No matches";

        const message =
            document.createElement("div");

        message.className = "empty";

        message.textContent =
            `No posts found for "${query}".`;

        posts.appendChild(message);

        return;
    }

    status.textContent = normalizedQuery
        ? `${filtered.length} result${filtered.length === 1 ? "" : "s"}`
        : `${filtered.length} post${filtered.length === 1 ? "" : "s"}`;

    for (const entry of filtered) {
        const link =
            document.createElement("a");

        link.className = "post";
        link.href = entry.url;

        const date =
            document.createElement("div");

        date.className = "date";
        date.textContent =
            formatDate(entry.timestamp);

        const title =
            document.createElement("div");

        title.className = "title";

        title.appendChild(
            highlightMatch(
                entry.title,
                normalizedQuery
            )
        );

        const arrow =
            document.createElement("div");

        arrow.className = "post-arrow";

        arrow.appendChild(
            createArrowIcon()
        );

        link.append(
            date,
            title,
            arrow
        );

        posts.appendChild(link);
    }
}
        function showLoading() {
            posts.replaceChildren();

            const loading =
                document.createElement("div");

            loading.className = "loading";


            for (let i = 0; i < 3; i++) {
                const line =
                    document.createElement("div");

                line.className = "loading-line";

                loading.appendChild(line);
            }


            posts.appendChild(loading);
        }


        async function loadPosts() {

            showLoading();

            try {

                const response =
                    await fetch("./index.json", {
                        cache: "no-cache"
                    });


                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                const entries =
                    await response.json();


                if (!Array.isArray(entries)) {
                    throw new Error(
                        "index.json is not an array"
                    );
                }


                allEntries = entries;
                renderPosts(allEntries);

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Index unavailable";


                const message =
                    document.createElement("div");

                message.className = "error";

                message.textContent =
                    "index.json could not be loaded. Please try again later.";


                posts.replaceChildren(message);
            }
        }
const searchInput =
    document.getElementById("searchInput");

const clearSearch =
    document.getElementById("clearSearch");

searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {
        const query = searchInput.value.trim();

        clearSearch.hidden = query === "";

        renderPosts(allEntries, query);
    }, 80);
});

clearSearch.addEventListener("click", () => {
    searchInput.value = "";

    clearSearch.hidden = true;

    renderPosts(allEntries);

    searchInput.focus();
});

document.addEventListener("keydown", event => {
    const target = event.target;

    const typing =
        target instanceof HTMLInputElement ||
        target instanceof HTMLTextAreaElement ||
        target.isContentEditable;

    /*
     * /
     * Focus search from anywhere on the page.
     */
    if (
        event.key === "/" &&
        !typing
    ) {
        event.preventDefault();
        searchInput.focus();
    }

    /*
     * Ctrl/Cmd + K
     */
    if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "k"
    ) {
        event.preventDefault();
        searchInput.focus();
    }

    /*
     * Escape
     */
    if (
        event.key === "Escape" &&
        document.activeElement === searchInput
    ) {
        searchInput.value = "";

        clearSearch.hidden = true;

        renderPosts(allEntries);

        searchInput.blur();
    }
});


        loadPosts();
    </script>
